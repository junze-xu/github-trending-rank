name: build

on:
  # 仅当采集器推送了新 archive 数据、或渲染/构建代码变更时才构建部署；
  # 不再挂在 workflow_run 上（每小时空跑的采集也会触发构建，纯属浪费）。
  push:
    branches: [main]
    paths:
      - "archive/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: derive & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
